name: build

# Build and test every branch except main (main gets its own release workflow).
# Windows and Linux only: BorgStudio Server supports no other platforms.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BorgStudio.Server.slnx

      - name: Build
        run: dotnet build BorgStudio.Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BorgStudio.Server.slnx --configuration Release --no-build
