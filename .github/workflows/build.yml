name: build

# Build, test and package check for every branch except main (main gets the release workflow).
# Windows and Linux only: BorgStudio Server supports no other platforms.
# On dev, a green run also publishes the development build: the pre-release "dev" on GitHub (replaced
# every time) and the container image tag :dev, which "update --channel dev" installs.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  # The version baked into the packages: on dev the next release plus the run, e.g. 0.5.0-dev.42.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the next version

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/dev ]]; then
            next=$(bash .github/scripts/next-release.sh notes.md)
            version="$next-dev.$GITHUB_RUN_NUMBER"
          else
            version="0.0.0-ci.$GITHUB_RUN_NUMBER"
            echo "Not on dev: no development build." > notes.md
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF_NOTES"
            cat notes.md
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
          echo "Version **$version**" >> "$GITHUB_STEP_SUMMARY"

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BorgStudio.Server.slnx

      - name: Build
        run: dotnet build BorgStudio.Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BorgStudio.Server.slnx --configuration Release --no-build

  # The install scripts: ShellCheck for the shell scripts, the PowerShell parser for the Windows ones.
  scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck deploy/linux/*.sh deploy/lxc/*.sh deploy/proxmox/*.sh .github/scripts/*.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem deploy/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  package:
    needs: [version, build]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Builds the container image (amd64) and starts it once, without publishing anything.
  docker:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docker-amd64
          path: context/amd64

      - name: Build image
        run: |
          cp deploy/docker/Dockerfile context/
          docker build --build-arg TARGETARCH=amd64 --build-arg VERSION=0.0.0-ci -t borgstudio-server:ci context

      - name: Start image
        run: |
          docker run -d --name server -p 8080:8080 -p 2222:2222 borgstudio-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/setup; then
              docker logs server | grep -q "setup code" && echo "Server answers and shows its setup code." && exit 0
            fi
            sleep 2
          done
          docker logs server
          exit 1

      # The server starts its own sshd for borg inside the container.
      - name: SSH service for borg
        run: |
          for _ in $(seq 1 30); do
            if ssh-keyscan -p 2222 -t ed25519 localhost 2> /dev/null | grep -q ssh-ed25519; then
              docker exec server /usr/bin/borg --version
              exit 0
            fi
            sleep 2
          done
          docker logs server
          exit 1

  # Installs the Linux archive as a systemd service, updates it, and removes it again.
  install-linux:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-linux-x64
          path: dist

      - name: Install
        run: |
          # On real systems /opt belongs to root and only root writes to it; sshd insists on that.
          sudo chown root:root /opt && sudo chmod 755 /opt
          tar -xzf dist/*.tar.gz
          sudo ./borgstudio-server/install.sh | tee install.log
          grep -q "Setup code" install.log
          systemctl is-active --quiet borgstudio-server
          curl -fsSk -o /dev/null https://localhost:8443/setup
          test "$(sudo stat -c %a /opt/borgstudio-server/data)" = 700

      - name: Update keeps the data
        run: |
          code=$(sudo cat /opt/borgstudio-server/data/setup-code.txt)
          sudo ./borgstudio-server/install.sh > /dev/null
          test "$(sudo cat /opt/borgstudio-server/data/setup-code.txt)" = "$code"
          curl -fsSk -o /dev/null https://localhost:8443/setup

      # The LXC installer's status: channel stable, and the latest release found on GitHub.
      - name: Update channels
        run: |
          curl -fsSL -o lxc-install.sh "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/deploy/lxc/lxc-install.sh"
          sudo bash lxc-install.sh --status | tee status.log
          grep -q "Channel:   .*stable" status.log
          grep -q "Latest release" status.log

      - name: Emergency command runs as the service user
        run: |
          sudo runuser -u borgstudio -- /opt/borgstudio-server/BorgStudio.Server reset-admin | tee reset.log || true
          grep -q "no administrator yet" reset.log

      # The real thing: set up the installed server, pair an "app" through the interface and back up
      # with borg over the server's own SSH service.
      - uses: actions/checkout@v7
        with:
          path: source

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: source/global.json

      - name: Backup with borg over SSH
        run: |
          export BORGSTUDIO_E2E_URL=https://localhost:8443
          BORGSTUDIO_E2E_SETUP_CODE=$(sudo cat /opt/borgstudio-server/data/setup-code.txt)
          export BORGSTUDIO_E2E_SETUP_CODE
          export BORGSTUDIO_E2E_BORG=/opt/borgstudio-server/borg/borg.exe
          dotnet test source/tests/BorgStudio.Server.Tests --filter "FullyQualifiedName~EndToEnd" --logger "console;verbosity=normal"

      - name: Uninstall
        run: |
          sudo /opt/borgstudio-server/uninstall.sh
          test -d /opt/borgstudio-server/data
          sudo /opt/borgstudio-server/uninstall.sh --purge 2> /dev/null || sudo ./borgstudio-server/uninstall.sh --purge
          test ! -e /opt/borgstudio-server
          ! id borgstudio 2> /dev/null

      - name: Service log
        if: failure()
        run: sudo journalctl -u borgstudio-server --no-pager | tail -50

  # Installs the Windows archive as a Windows service and removes it again.
  install-windows:
    needs: package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-win-x64
          path: dist

      - name: Install
        run: |
          Expand-Archive (Get-Item dist/*.zip) -DestinationPath .
          ./borgstudio-server/install.ps1 *>&1 | Tee-Object -FilePath install.log
          if (-not (Select-String -Path install.log -Pattern 'Setup code' -Quiet)) { throw 'No setup code shown' }
          if ((Get-Service BorgStudioServer).Status -ne 'Running') { throw 'Service is not running' }
          $response = Invoke-WebRequest https://localhost:8443/setup -SkipCertificateCheck
          if ($response.StatusCode -ne 200) { throw "HTTP $($response.StatusCode)" }

      - name: Uninstall
        run: |
          & "$env:ProgramFiles/BorgStudio Server/uninstall.ps1" -Purge
          if (Get-Service BorgStudioServer -ErrorAction SilentlyContinue) { throw 'Service still exists' }
          if (Test-Path "$env:ProgramFiles/BorgStudio Server") { throw 'Folder still exists' }

      - name: Service log
        if: failure()
        run: Get-WinEvent -LogName Application -MaxEvents 30 | Format-List TimeCreated, ProviderName, Message

  # dev only, after every check passed: replaces the pre-release "dev" and the image tag :dev.
  publish-dev:
    if: github.ref == 'refs/heads/dev'
    needs: [version, build, scripts, package, docker, install-linux, install-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NOTES: ${{ needs.version.outputs.notes }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: docker-*
          path: context

      - name: Installer scripts and checksums
        run: |
          cp deploy/lxc/lxc-install.sh deploy/proxmox/proxmox-create-ct.sh dist/
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Replace the pre-release "dev"
        run: |
          {
            printf 'Development build %s from the dev branch (%s). Not a release: for trying what comes next.\n\n' "$VERSION" "${GITHUB_SHA::7}"
            printf 'Install or switch in an LXC container or VM: `update --channel dev`, back with `update --channel stable`.\n\n'
            printf '%s\n' "$NOTES"
          } > notes.md
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2> /dev/null || true
          gh release create dev dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "BorgStudio Server $VERSION (development build)" \
            --notes-file notes.md

      - name: Container image context
        run: |
          mv context/docker-amd64 context/amd64
          mv context/docker-arm64 context/arm64
          cp deploy/docker/Dockerfile context/
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: context
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.IMAGE }}:dev
